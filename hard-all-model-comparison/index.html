    <style>
:root {
  color-scheme: light;
  --page: #f4f5f6;
  --paper: #ffffff;
  --ink: #181a1d;
  --muted: #70757c;
  --line: #d8dadd;
  --line-soft: #eceef0;
  --green: #3f7836;
  --amber: #ad6a00;
  --red: #b33a3a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 320px;
  overflow-wrap: anywhere;
  background: var(--page);
  color: var(--ink);
  font: 16px/1.45 Arial, Helvetica, sans-serif;
}

button, input, select { font: inherit; }
a { color: inherit; }

.topbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 2rem;
  max-width: 1880px;
  margin: 0 auto;
  padding: 1.8rem 1.5rem 1.15rem;
}

.eyebrow {
  margin: 0 0 0.3rem;
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.14em;
}

h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(2rem, 3.2vw, 3.25rem);
  line-height: 1;
  letter-spacing: -0.035em;
}

.summary {
  display: flex;
  gap: 1.4rem;
  color: var(--muted);
  font-size: 0.82rem;
  text-align: right;
}

.summary strong {
  display: block;
  color: var(--ink);
  font-size: 1.05rem;
}

main {
  max-width: 1880px;
  margin: 0 auto 3rem;
  background: var(--paper);
  border: 1px solid var(--line-soft);
  box-shadow: 0 2px 12px rgba(22, 28, 34, 0.08);
}

.controls {
  display: flex;
  align-items: end;
  gap: 0.9rem;
  padding: 0.8rem 1rem;
  border-bottom: 1px solid var(--line-soft);
}

.search-field, .select-field {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--muted);
  font-size: 0.82rem;
}

input, select {
  min-height: 2.2rem;
  padding: 0.4rem 0.65rem;
  border: 1px solid var(--line);
  border-radius: 0.2rem;
  background: #fff;
  color: var(--ink);
  outline: none;
}

input { width: min(24rem, 38vw); }
input:focus, select:focus { border-color: #666; }

.model-totals {
  display: flex;
  gap: 1rem;
  margin-left: auto;
  color: var(--muted);
  font-size: 0.78rem;
}

.model-total strong { color: var(--ink); }

.metrics-overview {
  padding: 0.8rem 1rem 0.9rem;
  border-bottom: 1px solid var(--line);
}

.metrics-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 0.55rem;
}

.metrics-heading h2 {
  margin: 0;
  font-size: 0.95rem;
}

.metrics-heading span,
.metrics-empty {
  color: var(--muted);
  font-size: 0.78rem;
}

.metrics-table-scroll { overflow-x: auto; }

.metrics-overview table {
  width: 100%;
  min-width: 970px;
  border-collapse: collapse;
  font-size: 0.76rem;
  font-variant-numeric: tabular-nums;
}

.metrics-overview th,
.metrics-overview td {
  padding: 0.42rem 0.55rem;
  border-bottom: 1px solid var(--line-soft);
  text-align: right;
  white-space: nowrap;
}

.metrics-overview thead th {
  color: var(--muted);
  font-weight: 600;
}

.metrics-overview th:first-child { text-align: left; }
.metrics-overview tbody tr:last-child > * { border-bottom: 0; }
.metrics-overview tr[data-model="gpt-5.6-sol-with-skill"] { background: #f2f7f0; }
.metrics-overview abbr { text-decoration: none; cursor: help; }

.mobile-guide { display: none; }

.samples { padding: 0 1rem; }

.sample { border-bottom: 1px solid var(--line); }
.sample:last-child { border-bottom: 0; }

.sample-header {
  display: flex;
  align-items: baseline;
  gap: 0.7rem;
  padding: 0.65rem 0.35rem 0.35rem;
}

.sample-id {
  flex: none;
  color: var(--green);
  font: 700 0.75rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.sample h2 {
  margin: 0;
  overflow: hidden;
  font-size: 0.88rem;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dimensions {
  flex: none;
  margin-left: auto;
  color: var(--muted);
  font-size: 0.75rem;
}

.comparison-scroll {
  overflow-x: auto;
  overscroll-behavior-inline: contain;
}

.comparison-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(270px, 1fr));
  min-width: 1120px;
}

.visual-card {
  min-width: 0;
  padding: 0.45rem 0.75rem 0.7rem;
  border-right: 1px dashed #b8bbc0;
}

.visual-card:last-child { border-right: 0; }

.card-label {
  padding: 0.15rem 0 0.45rem;
  color: var(--ink);
  font-size: 0.86rem;
  font-weight: 700;
  text-align: center;
}

.canvas {
  display: grid;
  place-items: center;
  position: relative;
  height: clamp(190px, 18vw, 315px);
  background: #fff;
}

.canvas > * { grid-area: 1 / 1; }

.canvas img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  background: #fff;
  cursor: zoom-in;
}

.result-metrics {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.2rem 0.7rem;
  min-height: 2.45rem;
  padding-top: 0.28rem;
  color: var(--muted);
  font-size: 0.68rem;
  font-variant-numeric: tabular-nums;
}

.result-metrics strong { color: var(--ink); font-weight: 600; }
.result-metrics.is-empty { color: #999; }
.result-metrics.is-invalid { color: var(--red); }
.metric-warning { font-weight: 700; }

.image-status {
  color: #9a9da1;
  font-size: 0.76rem;
}

.load-failed .image-status { color: var(--red); }

.empty {
  display: grid;
  gap: 0.2rem;
  place-items: center;
  color: #9a9da1;
  font-size: 0.82rem;
  text-align: center;
}

.empty strong { color: #676b70; font-weight: 600; }

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.7rem;
  min-height: 1.7rem;
  padding-top: 0.35rem;
  color: var(--muted);
  font-size: 0.72rem;
}

.state {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

.state::before {
  width: 0.42rem;
  height: 0.42rem;
  border-radius: 50%;
  background: #a4a7ab;
  content: "";
}

.state[data-state="complete"]::before { background: var(--green); }
.state[data-state="preview"]::before,
.state[data-state="running"]::before { background: var(--amber); }
.state[data-state="failed"]::before { background: var(--red); }

.file-links { display: flex; gap: 0.55rem; }

.file-links a {
  color: #44484d;
  text-decoration-color: #b7b9bc;
  text-underline-offset: 0.15rem;
}

.file-links a:hover { color: var(--green); }

.loading, .no-results {
  margin: 3rem;
  color: var(--muted);
  text-align: center;
}

.lightbox {
  width: calc(100vw - 2rem);
  height: calc(100vh - 2rem);
  max-width: none;
  max-height: none;
  padding: 0;
  border: 1px solid #aaa;
  background: #fff;
  color: var(--ink);
}

.lightbox::backdrop { background: rgba(0, 0, 0, 0.7); }

.lightbox-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 3.6rem;
  padding: 0.6rem 0.9rem;
  border-bottom: 1px solid var(--line);
}

.lightbox-bar strong, .lightbox-bar span { display: block; }
.lightbox-bar span { color: var(--muted); font-size: 0.78rem; }
.lightbox-actions { display: flex; align-items: center; gap: 0.6rem; }

.lightbox-actions a, .lightbox-actions button {
  padding: 0.4rem 0.65rem;
  border: 1px solid #aaa;
  background: #fff;
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
}

.lightbox-stage {
  display: grid;
  place-items: center;
  height: calc(100% - 3.6rem);
  overflow: auto;
  padding: 1rem;
  background: #f2f2f2;
}

.lightbox-stage img { max-width: 100%; max-height: 100%; background: #fff; }

@media (max-width: 820px) {
  body { overflow-x: hidden; }

  .topbar {

    box-shadow: none;
  }

  .controls {
    display: grid;

  }

  .search-field, .select-field {
    display: grid;
    align-items: stretch;

  }

  .search-field { grid-column: 1 / -1; }

  input, select {
    width: 100%;
    min-height: 2.75rem;
    font-size: 1rem;
  }

  .model-totals {
    grid-column: 1 / -1;
    width: calc(100vw - 1.8rem);
    margin-left: 0;
    padding-bottom: 0.1rem;
    gap: 0.8rem;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }

  .model-totals::-webkit-scrollbar { display: none; }

  .metrics-overview { padding: 0.75rem 0.9rem; }

  .metrics-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 0.2rem;
  }

  .mobile-guide {
    display: block;
    margin: 0;
    padding: 0.65rem 0.9rem;
    border-bottom: 1px solid var(--line-soft);
    background: #f8faf8;
    color: #536050;
    font-size: 0.78rem;
  }

  .samples { padding: 0; }

  .sample {
    padding: 0.25rem 0 0.7rem;
    content-visibility: auto;
    contain-intrinsic-size: auto 340px;
  }

  .sample-header {
    align-items: flex-start;
    flex-wrap: wrap;
    padding: 0.75rem 0.9rem 0.55rem;
  }

  .sample h2 {
    display: -webkit-box;
    flex-basis: calc(100% - 5.5rem);
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-height: 1.35;
    white-space: normal;
  }

  .dimensions { display: none; }

  .comparison-scroll {
    overflow: visible;
  }

  .comparison-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    width: 100%;
    min-width: 0;
    gap: 0.55rem;
    padding: 0 0.9rem;
  }

  .visual-card {
    display: grid;
    grid-template-rows: auto clamp(130px, 38vw, 190px) auto auto;
    width: auto;
    padding: 0.5rem 0.65rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 0.5rem;
    background: #fff;
  }

  .visual-card:first-child {
    border-color: #9fbd99;
    background: #fbfdfb;
  }

  .visual-card:last-child { border-right: 1px solid var(--line); }

  .canvas { height: auto; }

  .card-label {
    padding-bottom: 0.35rem;
    overflow: hidden;
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-footer {
    align-items: flex-start;
    flex-direction: column;
    justify-content: flex-start;
    min-height: 4.4rem;
  }

  .file-links a {
    display: inline-flex;
    align-items: center;
    min-height: 2.5rem;
    padding: 0 0.25rem;
  }

  .lightbox {
    width: 100vw;
    height: 100dvh;
    margin: 0;
    border: 0;
  }

  .lightbox-bar {
    align-items: flex-start;
    min-height: 4.25rem;
    padding: 0.55rem 0.65rem;
  }

  .lightbox-bar > div:first-child {
    min-width: 0;
    overflow: hidden;
  }

  .lightbox-bar strong,
  .lightbox-bar span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lightbox-actions { flex: none; }

  .lightbox-actions a { display: none; }

  .lightbox-actions button {
    min-width: 3.25rem;
    min-height: 2.75rem;
  }

  .lightbox-stage {
    height: calc(100% - 4.25rem);
    padding: 0.5rem;
    touch-action: pinch-zoom;
  }
}

const totals = document.getElementById("model-totals");
const metricsOverview = document.getElementById("metrics-overview");
const loading = document.getElementById("loading");
const search = document.getElementById("search");
const filter = document.getElementById("filter");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightbox-image");
const lightboxTitle = document.getElementById("lightbox-title");
const lightboxMeta = document.getElementById("lightbox-meta");
const lightboxOpen = document.getElementById("lightbox-open");
let imageObserver = null;

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function duration(seconds) {
  if (seconds == null) return "";
  const minutes = Math.floor(seconds / 60);
  const rest = Math.round(seconds % 60);
  return minutes ? `${minutes}m ${rest}s` : `${rest}s`;
}

function fixed(value, digits = 3) {
  return value == null ? "—" : Number(value).toFixed(digits);
}

function count(value) {
  return value == null ? "—" : Math.round(Number(value)).toLocaleString();
}

function renderMetrics(models, stats) {
  const quantitative = stats.metrics_by_model || {};
  const rows = models.map((model) => {
    const metric = quantitative[model.id];
    if (!metric) return "";
    return `<tr data-model="${escapeHtml(model.id)}">
      <th scope="row">${escapeHtml(model.label)}</th>
      <td>${fixed(metric.ssim_mean)}</td>
      <td>${fixed(metric.lpips_mean)}</td>
      <td>${fixed(metric.psnr_mean, 2)}</td>
      <td>${fixed(metric.foreground_iou_mean)}</td>
      <td>${metric.success_count}/${metric.case_count}</td>
      <td>${metric.metric_count}/${metric.case_count}</td>
      <td>${duration(metric.elapsed_median_seconds)}</td>
      <td>${fixed(metric.command_mean, 1)}</td>
      <td>${fixed(metric.svg_native_drawable_mean, 1)}</td>
      <td>${fixed(metric.pptx_native_shape_mean, 1)}</td>
      <td>${count(metric.output_tokens_mean)}</td>
    </tr>`;
  }).join("");
  if (!rows) {
    metricsOverview.innerHTML = `<p class="metrics-empty">尚未生成定量结果。</p>`;
    return;
  }
  const comparison = stats.comparisons?.skill_vs_sol;
  const delta = comparison?.mean_delta;
  const comparisonText = comparison
    ? `Skill 对 Sol：SSIM ${comparison.wins} 胜 / ${comparison.ties} 平 / ${comparison.losses} 负，平均差 ${delta >= 0 ? "+" : ""}${fixed(delta, 4)}`
    : "";
  metricsOverview.innerHTML = `
    <div class="metrics-heading">
      <h2>三组定量总览</h2>
      <span>${escapeHtml(comparisonText)}</span>
    </div>
    <div class="metrics-table-scroll">
      <table>
        <thead><tr>
          <th scope="col">模型</th>
          <th scope="col"><abbr title="结构相似性，越高越好">SSIM ↑</abbr></th>
          <th scope="col"><abbr title="深度感知距离，越低越好">LPIPS ↓</abbr></th>
          <th scope="col"><abbr title="峰值信噪比，单位 dB，越高越好">PSNR ↑</abbr></th>
          <th scope="col"><abbr title="非白前景区域交并比，越高越好">前景 IoU ↑</abbr></th>
          <th scope="col">成功</th>
          <th scope="col"><abbr title="成功渲染且未使用整图铺底的样本">有效样本</abbr></th>
          <th scope="col">中位耗时</th>
          <th scope="col">平均命令</th>
          <th scope="col">SVG 原生元素</th>
          <th scope="col">PPT 原生对象</th>
          <th scope="col">平均输出 Token</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function lazyImage(source, alt, title, meta) {
  return `<span class="image-status" aria-hidden="true">图片加载中…</span>
    <img class="lazy-image" loading="lazy" decoding="async" fetchpriority="low" data-src="${escapeHtml(source)}" alt="${escapeHtml(alt)}" data-lightbox data-title="${escapeHtml(title)}" data-meta="${escapeHtml(meta)}" />`;
}

function revealImage(image) {
  const source = image.dataset.src;
  if (!source) return;
  image.addEventListener("load", () => image.classList.add("is-loaded"), { once: true });
  image.addEventListener("error", () => {
    const canvas = image.closest(".canvas");
    if (canvas) {
      canvas.classList.add("load-failed");
      const status = canvas.querySelector(".image-status");
      if (status) status.textContent = "图片加载失败";
    }
  }, { once: true });
  image.src = source;
  image.removeAttribute("data-src");
  imageObserver?.unobserve(image);
}

function observeImages() {
  imageObserver?.disconnect();
  const images = samples.querySelectorAll("img[data-src]");
  if (!("IntersectionObserver" in window)) {
    images.forEach(revealImage);
    return;
  }
  imageObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) revealImage(entry.target);
    });
  }, { rootMargin: "200px 0px", threshold: 0.01 });
  images.forEach((image, index) => {
    if (index < 10) {
      revealImage(image);
    } else {
      imageObserver.observe(image);
    }
  });
}

function resultCard(item, result, modelLabel) {
  const image = result.svg
    ? lazyImage(result.svg, `${item.id} ${modelLabel} 重建结果`, item.title, modelLabel)
    : `<div class="empty"><strong>${stateLabels[result.state]}</strong><span>暂无 SVG 结果</span></div>`;
  const links = [
    result.svg ? `<a href="${result.svg}" target="_blank" rel="noreferrer">SVG</a>` : "",
    result.pptx ? `<a href="${result.pptx}">PPTX</a>` : "",
    result.trace ? `<a href="${result.trace}" target="_blank" rel="noreferrer">TRACE</a>` : "",
  ].join("");
  const visual = result.metrics?.visual;
  const disqualified = result.metrics && result.metrics.qualified === false;
  const metricLine = visual
    ? `<div class="result-metrics${disqualified ? " is-invalid" : ""}" aria-label="视觉指标">
        <span title="结构相似性">SSIM <strong>${fixed(visual.ssim)}</strong></span>
        <span title="深度感知距离，越低越好">LPIPS <strong>${fixed(visual.lpips)}</strong></span>
        <span title="峰值信噪比，单位 dB">PSNR <strong>${fixed(visual.psnr, 1)}</strong></span>
        <span title="前景区域交并比">IoU <strong>${fixed(visual.foreground_iou)}</strong></span>
        ${disqualified ? `<span class="metric-warning" title="整图铺底样本不计入模型视觉均值">整图铺底</span>` : ""}
      </div>`
    : `<div class="result-metrics is-empty">暂无定量结果</div>`;
  return `
    <article class="visual-card" aria-label="${escapeHtml(modelLabel)}">
      <div class="card-label">${escapeHtml(modelLabel)}</div>
      <div class="canvas">${image}</div>
      ${metricLine}
      <div class="card-footer">
        <span class="state" data-state="${result.state}">${stateLabels[result.state]}${result.elapsed_seconds == null ? "" : ` · ${duration(result.elapsed_seconds)}`}</span>
        <span class="file-links">${links}</span>
      </div>
    </article>`;
}

function referenceCard(item) {
  return `
    <article class="visual-card" aria-label="参考图">
      <div class="card-label">参考图</div>
      <div class="canvas">
        ${lazyImage(item.reference, `${item.id} 原始参考图`, item.title, `Reference · ${item.size[0]} × ${item.size[1]}`)}
      </div>
      <div class="card-footer">
        <span class="state" data-state="complete">原图 · ${item.size[0]} × ${item.size[1]}</span>
        <span class="file-links"><a href="${item.reference}" target="_blank" rel="noreferrer">JPG</a></span>
      </div>
    </article>`;
}

function visible(item) {
  const text = `${item.id} ${item.title}`.toLowerCase();
  if (appState.query && !text.includes(appState.query)) return false;
  const available = item.results.filter((result) => result.svg).length;
  if (appState.filter === "available") return available > 0;
  if (appState.filter === "complete") return available === item.results.length;
  if (appState.filter === "active") {
    return item.results.some((result) => ["running", "failed", "preview"].includes(result.state));
  }
  return true;
}

function render() {
  if (!appState.data) return;
  const { models, items, summary: stats, generated_at: generatedAt } = appState.data;
  const available = Object.values(stats.available_by_model).reduce((sum, value) => sum + value, 0);
  summary.innerHTML = `
    <span><strong>${stats.cases}</strong>参考图</span>
    <span><strong>${available}/${stats.total_runs}</strong>已有 SVG</span>
    <span><strong>${generatedAt.slice(11, 19)}</strong>最后扫描</span>`;
  totals.innerHTML = models.map((model) => `
    <span class="model-total"><strong>${escapeHtml(model.label)}</strong> ${stats.available_by_model[model.id]}/${stats.cases}</span>
  `).join("");
  renderMetrics(models, stats);

  const shown = items.filter(visible);
  samples.innerHTML = shown.length ? shown.map((item) => {
    const cards = item.results.map((result) => {
      const model = models.find((entry) => entry.id === result.model);
      return resultCard(item, result, model?.label || result.model);
    }).join("");
    return `
      <article class="sample">
        <header class="sample-header">
          <span class="sample-id">${escapeHtml(item.id)}</span>
          <h2 title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</h2>
          <span class="dimensions">${item.size[0]} × ${item.size[1]}</span>
        </header>
        <div class="comparison-scroll">
          <div class="comparison-grid">${referenceCard(item)}${cards}</div>
        </div>
      </article>`;
  }).join("") : `<p class="no-results">没有符合当前筛选条件的样本。</p>`;
  observeImages();
}

async function refresh() {
  try {
    const response = await fetch("/api/results", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const signature = JSON.stringify(data.items.map((item) => item.results));
    appState.data = data;
    if (signature !== appState.signature) {
      appState.signature = signature;
      render();
    } else {
      const generatedAt = data.generated_at;
      const last = summary.querySelector("span:last-child strong");
      if (last) last.textContent = generatedAt.slice(11, 19);
    }
    loading.hidden = true;
  } catch (error) {
    loading.hidden = false;
    loading.textContent = `读取失败：${error.message}`;
  }
}

search.addEventListener("input", () => {
  appState.query = search.value.trim().toLowerCase();
  render();
});

filter.addEventListener("change", () => {
  appState.filter = filter.value;
  render();
});

samples.addEventListener("click", (event) => {
  const image = event.target.closest("[data-lightbox]");
  if (!image) return;
  const source = image.currentSrc || image.getAttribute("src") || image.dataset.src;
  if (!source) return;
  lightboxImage.src = source;
  lightboxImage.alt = image.alt;
  lightboxTitle.textContent = image.dataset.title;
  lightboxMeta.textContent = image.dataset.meta;
  lightboxOpen.href = image.src;
  lightbox.showModal();
});

document.getElementById("lightbox-close").addEventListener("click", () => lightbox.close());
lightbox.addEventListener("click", (event) => {
  if (event.target === lightbox) lightbox.close();
});
lightbox.addEventListener("close", () => lightboxImage.removeAttribute("src"));

if (window.__STATIC_RESULTS__) {
  appState.data = window.__STATIC_RESULTS__;
  appState.signature = JSON.stringify(appState.data.items.map((item) => item.results));
  loading.hidden = true;
  render();
} else {
  refresh();
  window.setInterval(refresh, 15000);
}

</script>
  </body>
</html>
